<!doctype html><html><head><meta charset="utf-8"></head><body style="width:340px;max-height:520px;overflow:auto;font-family:system-ui"><h3>Catalog AI Monitor</h3><p>Only chats you add are monitored. No cookies or credentials are read.</p><button id="select">Add current chat</button> <button id="remove">Remove current chat</button><p><input id="manual" placeholder="Group title if detection fails" style="width:220px"> <button id="addManual">Add</button></p><fieldset><legend>Automatic scanning</legend><label><input id="autoScan" type="checkbox"> Cycle through selected groups</label><p><label>Seconds per group <input id="seconds" type="number" min="10" max="120" value="15" style="width:55px"></label></p><small>This visibly changes the open chat. Keep WhatsApp Web in a dedicated visible window.</small></fieldset><p><button id="stop">Stop all monitoring</button></p><p id="message"></p><div id="status"></div><script src="popup.js"></script></body></html>
